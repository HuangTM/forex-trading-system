body:
  C1_NZDUSD_admit: "UNCHANGED - ADMIT (DQ-PASS; sole flag = legitimate New-Year-2024 73h closure)."
  C2_H1_freeze:
    decision: REMAIN-FROZEN
    direction_of_change: STRENGTHENED
    numbers: "USD-majors-6 PC1 66.4%, rho_bar_eff 0.597 (was USD-5 0.555), N_eff 1.51; ALL-7 PC1 57.3%, rho_bar_eff 0.502, N_eff 1.74. G5 gate <= 0.41."
    reasoning: >
      Adding a 7th real pair RAISED PC1 and rho_bar_eff and LOWERED N_eff everywhere. NZDUSD is a
      commodity-dollar twin (+0.875 to AUDUSD): it loads the existing PC1 and concentrates risk. USD-6
      rho_bar_eff 0.597 is 0.187 above the gate; even diluted ALL-7 (0.502) is 0.092 above. The only
      un-landed pair is USDCHF - itself a dollar pair - which cannot drag eigenvalue concentration from
      ~0.60 below 0.41. The 8-pair all-USD-major H1 is STRUCTURALLY INCAPABLE of passing G5. Freeze
      correct and better-evidenced. (Proxy note: rho_bar_eff is the conservative sign-blind proxy; the
      0.09-0.19 gap to the gate is too large to be a proxy artifact.)
  C3_no_per_pair_pre_reg: "UNCHANGED - NZDUSD CD0 all 6 families FAIL net SR (best net F5 -2.19, best gross 0.99 < 1.44). No edge to pre-register."
  C4_data_acquisition:
    decision: ACQUIRE-CROSSES-NOT-USD-MAJORS
    direction_of_change: STRENGTHENED
    priority_crosses: [EURGBP, GBPJPY, AUDJPY]
    reasoning: >
      NZDUSD is the natural experiment confirming (no longer assuming) that a new USD-major concentrates
      the factor. The only diluter is the EURJPY cross (NZDUSD corr to EURJPY +0.125 vs +0.875 to AUDUSD).
      Priority: EURGBP (lowest dollar beta, intra-European driver) > GBPJPY (JPY funding/risk-off) >
      AUDJPY (risk-on/off carry). USDCHF DE-prioritized (would complete a set that already fails G5 and
      push concentration the wrong way). Acquisition justified only to test whether a cross MOVES the
      G5 gate; not a capital-deployment mandate.
  C5_no_trial_spend: "UNCHANGED - all 24 pair x family combos FAIL; none reach STRETCH/PASS; trial_id none; honest-N stays 30."
  pr_findings_closure:
    F-001: "CLOSED - NZDUSD now included in factor + CD0 analysis; C2/C4 re-issued on corrected numbers; verdict strengthened not reversed."
    F-002: "CLOSED - dual-metric disclosure stated (eigenvalue rho_bar_eff vs signed mean corr vs true PnL-contribution gate); proxy caveat retained."
  ranked_alternatives:
    - "1. Acquire EURGBP 1h; re-run factor proxy on 8-pair (7 landed + EURGBP) to test if a cross pulls rho_bar_eff toward 0.41."
    - "2. Acquire GBPJPY + AUDJPY 1h (carry/risk-off); re-run factor + CD0."
    - "3. If no cross moves the gate, REDIRECT to a cross-only / carry-factor mandate. Do NOT acquire USDCHF as a diversification play."
  retirement_criteria:
    - "H1 un-freeze FORBIDDEN while USD-only-slice rho_bar_eff > 0.41 (currently 0.597 - unsatisfiable by adding USDCHF)."
    - "Pre-registration entry requires CD0 net SR >= 1.76; currently 0/24 qualify (best net -2.19)."
    - "Cross-acquisition justified only while a candidate cross is expected to LOWER rho_bar_eff toward 0.41."
