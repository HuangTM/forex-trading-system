  Corrected QD cycle-2 facts (NZDUSD included) do not change the cycle-1 verdict - they STRENGTHEN it.
  Adding NZDUSD RAISED USD-bloc eigenvalue concentration in every comparison. C2 REMAIN-FROZEN holds
