# ----------------------------------------------------------------------
verdicts:

  claim_A:
    null_hypothesis: "More 1h USD-major data does NOT move H1 toward confirmability; the pooling-fraud failure mode (KILL-4/G5) is real and is made WORSE, not better, by adding correlated USD legs."
    decision: NULL NOT-REJECTED   # the OPTIMISTIC framing of Claim A is rejected; the null (no progress toward confirmability) stands.
    deciding_number: "sign-blind rho_bar_eff = 0.555 at k=5 vs 0.545 at k=3. Pre-declared gate: rho_bar <= 0.41 (H1 KILL-4 / confirmability_pass_conditions_measured_pre_slot). 0.555 > 0.41 by 0.145, and the GAP WIDENED with more data (0.545 -> 0.555)."
    secondary_number: "N_eff = 1.55 effective bets out of 5 nominal. Breadth is the entire confirmability lever for H1 (<=2yr depends on it); 1.55 effective pairs cannot deliver the events/yr x per-event-IR the prereg requires."
    interpretation: >
      The data drop does the OPPOSITE of what Claim A asserts. The remaining USD-majors (NZDUSD,
      USDCHF) are structurally dollar-correlated, so each new pair adds a near-redundant copy of the
      same dollar factor, not an independent bet. Adding data raised the measured correlation and
      lowered effective breadth. The prereg pre-registered THIS EXACT failure (reason-it-would-fail
      #4: "pooling fraud -- shared USD/EUR legs push rho_bar > 0.41, collapsing effective-N"). It fired.

  claim_B:
    null_hypothesis: "EURJPY hosts NO net-of-cost exploitable intraday edge in the canonical-family space."
    decision: NULL NOT-REJECTED   # claim B rejected; null stands.
    deciding_number: "Best net F2 = -0.87 (negative). Best gross F5 = 0.71, collapses post-cost. STRETCH bar = 1.44; PASS bar = 1.76. All 18 (pair x family) combos FAIL even the STRETCH bar. Best NET result is -0.87, i.e. ~2.31 Sharpe below STRETCH and on the wrong side of zero."
    interpretation: >
      Diversification value (corr 0.18-0.37) is necessary but NOT sufficient: a diversifier with no
      standalone edge contributes nothing tradeable. Every EURJPY family is net-negative; the one
      gross-positive family (F5=0.71) is below STRETCH even BEFORE cost and dies after it. There is
      no edge to diversify.

  claim_C:
    null_hypothesis: "Nothing in this data drop earns a trial-counter increment."
    decision: NULL NOT-REJECTED   # claim C rejected; null stands. NO-SPEND affirmed.
    deciding_number: "Highest result reaching ANY bar = none. Nothing >= PASS 1.76; nothing >= STRETCH 1.44. Best net Sharpe across the entire drop is NEGATIVE (EURJPY F2 = -0.87; all 18 combos fail). A trial increment burns DSR denominator capacity (honest-N 30) for zero candidate."
    interpretation: >
      Spending a counter increment requires at minimum a STRETCH-clearing candidate to confirm. There
      is none. An increment here would inflate the deflation denominator (penalizing every future real
      candidate) in exchange for nothing. NO-SPEND is the only calibrated action.

# ----------------------------------------------------------------------
kill_criterion_watch:
  documented_failure_mode: "infra-excitement / 'more data, let's go' substituting for a confirmable hypothesis (HONEST-REVIEW 2026-05-31: kill-criterion tripped on infra, not insight)."
  assessment: >
    ELEVATED RISK, contained for now. Claim A is the textbook shape of this failure mode: a
    capability acquisition (more 1h pairs) being narrated as research progress. The honest numbers
    say the acquisition made the binding gate (rho_bar) WORSE. Any role tempted to recommend
    "keep pulling data -> H1 will get there" is reasoning from infra-momentum, not evidence: the
    confirmability lever (breadth) is moving the wrong way. The org's own MEMORY documents a
    DATASET-WALL finding -- 12 daily pairs / limited 4h / zero volume cap events/yr x per-event-Sharpe.
    This drop is consistent with that wall, not an escape from it. No role's recommendation should
    treat "we now have more 1h pairs" as itself a result. The result is: the gate still fails.

methodological_soft_spots:
  - id: i
    topic: "rho_bar_eff is a raw-return EIGENVALUE PROXY, not the prereg's PnL/signal-contribution gate statistic."
    finding: >
      The H1 prereg defines the gate as "measured mean cross-pair SIGNAL correlation, k=8" (rho_bar <= 0.41).
      The evidence supplied is a raw-RETURN eigenvalue proxy. These are not the same statistic.
    does_it_change_verdict_on_A: "NO -- and it makes the verdict SAFER, not weaker."
    reasoning: >
      The proxy could in principle over- OR under-state the true signal correlation. But it does not
      rescue Claim A for two reasons. (1) Even taking the proxy at face value it FAILS the gate by a
      wide margin (0.555 vs 0.41) AND the direction of change with more data is adverse. (2) For a
      directional momentum signal, the signal IS a (sign/threshold) transform of returns, so raw-return
      correlation is a reasonable LOWER-information proxy for signal correlation, and the structural
      driver (shared USD leg) is identical for both. The honest fix is to RE-MEASURE the gate statistic
      exactly (request below) before any PASS could ever be claimed -- but a proxy that already fails
      cannot be used to ARGUE PASS. Using an in-spec proxy to NOT-REJECT the null is conservative and
      permitted; using it to reject the null would not be. We are doing the former.
  - id: ii
    topic: "CD0 / canonical-family screen is an IN-SAMPLE OPTIMISTIC upper bound."
    finding: "The all-FAIL result is in-sample. Out-of-sample it gets STRONGER, not weaker."
    reasoning: >
      In-sample = best case (no OOS decay, single fixed spec but on the development window). If the
      OPTIMISTIC upper bound is already net-NEGATIVE and below STRETCH for all 18 combos, OOS performance
      can only be <= in-sample in expectation (decay, regime shift, cost realization). The negative
      verdict is therefore robust: an upper bound that fails is a stronger kill than a point estimate
      that fails. This directly corroborates trial-48 and the CD0-3major prescreen.
  - id: iii
    topic: "gross-positive-but-cost-dominated pattern (e.g. USDCAD F1 gross 1.05; EURJPY F5 gross 0.71) -- any honest door left open?"
    finding: "NO honest door at current cost assumptions. One NARROW, NON-PROMOTABLE research note only."
    reasoning: >
      A gross-positive / net-negative result means raw directional structure may exist but is entirely
      consumed by transaction cost. This is NOT a tradeable edge and is NOT a STRETCH candidate -- the
      bar is NET. The only honest, non-spend follow-up (NOT a claim, NOT a trial) is: cost is the binding
      constraint, so the question is execution/cost, not signal. Gross 1.05 (USDCAD F1) is the single
      largest gross figure; if and only if a credibly CHEAPER execution path were demonstrated by the
      execution trader (lower realized round-trip than session-aware p90), the gross structure could be
      RE-SCREENED net. That is a hypothesis about COSTS, not a rescue of the current claims, and it does
      not justify a counter increment now. Absent a demonstrated cost reduction, gross-positive is noise-
      for-trading-purposes. Door stays shut.

C5_confirmation:
  no_implicit_trial_spend: true   # zero-budget affirmed; no candidate reached a bar; counter must NOT increment.
  no_stretch_to_pass_promotion: true   # nothing even reached STRETCH; there is nothing to promote.
  note: "If any descriptive log is written for this drop it MUST carry counts_toward_deflation_denominator=false, matching the CD0-3major-prescreen precedent."

tests_i_would_request_before_any_future_PASS_claim:
  route_to: quant-developer
  # I do not run code (python forbidden). These are the specs that would have to pass BEFORE H1 could
  # ever be called confirmable -- none are satisfied by this drop.
  - "Re-measure the EXACT prereg gate statistic: mean cross-pair SIGNAL correlation (not raw-return proxy) over the frozen H1 universe at realized k, with the same sign convention. Report rho_bar and resulting N_eff and years_to_validate. (Closes soft-spot i.)"
  - "Matched-random benchmark: random-entry trades, same instruments / same 3-bar hold / same session filter / same p90 cost. If random achieves >= the best net family Sharpe, the family is noise. (Expected: random ~= the strategies, since best net < 0.)"
  - "Permutation test: shuffle the momentum-sign label within each open-hour class, rerun the 18 combos. Report fraction of shuffles achieving net Sharpe >= the observed best. (p-value for the gross structure being directional vs artifact.)"
  - "Cost-sensitivity curve per gross-positive family (USDCAD F1, EURJPY F5): net Sharpe as a function of realized round-trip cost from p90 down to a CRO-attested floor. Identifies the cost at which gross structure (if real) would clear NET STRETCH -- a COST hypothesis, not a signal PASS."

