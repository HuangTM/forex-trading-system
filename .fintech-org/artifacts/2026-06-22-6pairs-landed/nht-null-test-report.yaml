  - "Per-family permutation / matched-random benchmarks were not supplied; the net-negative result makes them non-load-bearing for the current NO-SPEND, but they would be required before any PASS."

confidence: high
# Two of three nulls fail the binding gate by margins that are unambiguous and on the wrong side
# of zero (B, C) or the wrong side of the threshold AND moving adversely (A). The in-sample-optimistic
# nature of the screen makes the negative verdict conservative.

dissent-statement: |
  I CONCUR with NO-SPEND and I AFFIRM the zero-budget track. No dissent against a NO-SPEND
  recommendation -- that recommendation matches the evidence exactly.

  I REGISTER PRE-EMPTIVE DISSENT (append-only, severity material_concern) against any role
  recommendation, present or future, that frames this data drop as PROGRESS toward H1 confirmability.
  The evidence is the opposite of progress: the binding pooling gate rho_bar_eff moved from 0.545
  to 0.555 (gate is 0.41) as USD-majors were ADDED, and effective breadth is 1.55 bets out of 5.
  More USD-correlated data makes H1 LESS confirmable, not more, because breadth -- the only lever
  that buys the <=2yr confirmability window -- is collapsing. Restating Claim A's optimistic
  framing in any consensus artifact would be exactly the documented kill-criterion failure mode
  (infra-excitement substituting for a confirmable hypothesis, HONEST-REVIEW 2026-05-31) and would
  be inconsistent with the org's own DATASET-WALL finding.

  I FURTHER DISSENT (severity note) against any treatment of the gross-positive / net-negative
  families (USDCAD F1 gross 1.05; EURJPY F5 gross 0.71) as a partial win or a STRETCH candidate.
  The bar is NET. Net is negative. Gross-positive-but-cost-dominated is, for trading purposes,
  noise. The ONLY honest follow-up it supports is a COST hypothesis (can realized round-trip be
  driven below p90?), owned by execution -- not a signal claim, and not a counter increment.

  C5 affirmed: no implicit trial spend, no STRETCH->PASS promotion, counter does not increment,
  any descriptive log of this drop must carry counts_toward_deflation_denominator=false.

