claims-tested:
  - id: A
    text: "More 1h pair data brings the firm closer to a confirmable pooled USD-momentum edge (H1)."
  - id: B
    text: "EURJPY (the only diversifier, corr 0.18-0.37 to the EUR/GBP bloc) hosts an exploitable intraday edge."
