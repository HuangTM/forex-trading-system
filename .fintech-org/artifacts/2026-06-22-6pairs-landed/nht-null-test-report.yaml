  - "Bars PASS=1.76 / STRETCH=1.44 are the frozen, pre-declared thresholds for this space (consistent with CD0 entry and prep-plan rubric)."
  - "rho_bar gate 0.41 is the frozen H1 confirmability pre-condition (verified in qr-h1-prereg.yaml)."

knowledge_gaps:
