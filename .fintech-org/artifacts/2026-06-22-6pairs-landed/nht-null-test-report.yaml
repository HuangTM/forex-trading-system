  - "H1 prereg gate definitions: .fintech-org/artifacts/2026-06-16-prep-plan/qr-h1-prereg.yaml -- KILL-4 pooling-fraud/effective-N (G5), rho_bar <= 0.41, KILL-2 cost-domination, universe = 8 majors, honest_N=1, pre-registered failure reasons #3 (cost) and #4 (pooling fraud)."
